name: 打包安卓APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 JDK 17（Android 插件必须要 17，默认的 11 会失败）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 补齐 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # 工程里没有 gradlew（本机生成不了 gradle-wrapper.jar），
      # 所以云端直接装一份 Gradle 用；如果工程里以后有 gradlew 了，就自动优先用它
      - name: 准备 Gradle 8.2
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "用工程自带的 gradlew"
          else
            echo "工程没有 gradlew，云端装一份 Gradle 8.2"
            curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
            sudo unzip -q -o /tmp/gradle.zip -d /opt
            sudo ln -sfn /opt/gradle-8.2 /opt/gradle
            echo "/opt/gradle/bin" >> $GITHUB_PATH
          fi

      - name: 确认环境
        run: |
          java -version 2>&1 | head -2
          echo "JAVA_HOME=$JAVA_HOME"
          (gradle -v 2>&1 | head -6) || true

      - name: 编译 APK（调试签名，装上就能用）
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: 传出 APK
        uses: actions/upload-artifact@v4
        with:
          name: 入库实战区APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
